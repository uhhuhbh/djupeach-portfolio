name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'styles.css'
      - 'assets/**'
      - 'scripts/optimize_images.py'
      - '.github/workflows/deploy.yml'
      - '3470d50ba81685196fde9f294fa8957c.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python image processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js experience.js works.js media.js _site/
          cp assets/favicon.svg _site/assets/favicon.svg
          cp -R assets/fonts _site/assets/fonts
          python scripts/optimize_images.py --output-dir _site/assets/optimized
          cp 3470d50ba81685196fde9f294fa8957c.txt _site/3470d50ba81685196fde9f294fa8957c.txt
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
